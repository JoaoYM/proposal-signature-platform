name: CI - Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test CRM
      run: mvn -B clean verify --file crm/pom.xml
      env:
        SPRING_PROFILES_ACTIVE: test

    - name: Build and Test SIGN
      run: mvn -B clean verify --file sign/pom.xml
      env:
        SPRING_PROFILES_ACTIVE: test