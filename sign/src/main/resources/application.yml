spring:
  application:
    name: sign-api

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.type.preferred_uuid_jdbc_type: VARCHAR
  flyway:
    enabled: true
    baseline-on-migrate: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sign_db}
    username: ${SPRING_DATASOURCE_USERNAME:sign_user}
    password: ${SPRING_DATASOURCE_PASSWORD:sign_password}

  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 1.5

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  pattern:
    console: "{\"timestamp\":\"%d{yyyy-MM-dd HH:mm:ss}\",\"level\":\"%p\",\"service\":\"${spring.application.name}\",\"traceId\":\"%X{traceId}\",\"spanId\":\"%X{spanId}\",\"message\":\"%m\"}%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  tracing:
    sampling:
      probability: 1.0
