version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: power_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: power_db 
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: power_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # Porta do protocolo AMQP (para a aplicação)
      - "15672:15672" # Porta da interface de gerenciamento Web
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

volumes:
  mysql_data: